image: messages-api:local
imagePullPolicy: IfNotPresent
containerPort: 8080
kafkaBootstrapServers: localhost:9092
javaToolOptions: "-XX:AccccccccctiveProcessorCount=2 -XX:MaxRAMPercentage=75.0"
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
probes:
  startup:
    periodSeconds: 5
    failureThreshold: 36
  readiness:
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
autoscaling:
  minReplicas: 1
  maxReplicas: 10
  pollingInterval: 5
  cooldownPeriod: 30
  cpuTarget: 60
