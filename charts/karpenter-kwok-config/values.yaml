nodeClass:
  name: default

nodePool:
  name: default
  limits:
    cpu: "64"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  template:
    expireAfter: Never
    requirements:
      - key: kubernetes.io/os
        operator: In
        values:
          - linux
      - key: karpenter.sh/capacity-type
        operator: In
        values:
          - on-demand
